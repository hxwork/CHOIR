type: video
split: custom
root: /mlp_vepfs/share/hpl/project/code/Dyn_HaMR_new/test  # put your videos in root/videos/vid.mp4
video_dir: videos
seq: prod1
ext: mp4
src_path: ${data.root}/${data.video_dir}/${data.seq}.${data.ext}
frame_opts:
  ext: jpg
  fps: 25
  start_sec: 0
  end_sec: -1
use_cams: True
track_ids: "all"
shot_idx: 0
start_idx: 0
end_idx: -1
split_cameras: True
name: ${data.seq}-${data.track_ids}-shot-${data.shot_idx}-${data.start_idx}-${data.end_idx}
sources:
  images: ${data.root}/${data.video_dir}/dynhamr/images
  cameras: ${data.root}/${data.video_dir}/dynhamr/cameras/shot-${data.shot_idx}
  tracks: ${data.root}/${data.video_dir}/dynhamr/track_preds/${data.seq}
  shots: ${data.root}/${data.video_dir}/dynhamr/shot_idcs/${data.seq}.json
  video_dir: ${data.root}/${data.video_dir}

# VIPE-specific options
use_vipe: True
vipe_dir: ${data.root}/${data.video_dir}/dynhamr/vipe_results
vipe_root: /vepfs_default/chanxueyan/lhp/xh/code/Dyn_HaMR_new/third-party/vipe

