type: video
split: custom
# Defaults assume launching from dyn-hamr/. batch_test_videos.py overrides with abs paths.
# Layout: <root>/<video_id>/inputs/video.mp4 ; Hydra writes to <root>/<video_id>/stage1/dynhamr/
root: ../../../output
video_dir: videos
seq: prod1
ext: mp4
src_path: ${data.root}/${data.video_dir}/inputs/video.${data.ext}
frame_opts:
  ext: jpg
  fps: 25
  start_sec: 0
  end_sec: -1
use_cams: True
track_ids: "all"
shot_idx: 0
start_idx: 0
end_idx: -1
split_cameras: True
name: ${data.seq}-${data.track_ids}-shot-${data.shot_idx}-${data.start_idx}-${data.end_idx}
sources:
  images: ${data.root}/${data.video_dir}/stage1/dynhamr/images
  cameras: ${data.root}/${data.video_dir}/stage1/dynhamr/cameras/shot-${data.shot_idx}
  tracks: ${data.root}/${data.video_dir}/stage1/dynhamr/track_preds/${data.seq}
  shots: ${data.root}/${data.video_dir}/stage1/dynhamr/shot_idcs/${data.seq}.json
  video_dir: ${data.root}/${data.video_dir}

# VIPE-specific options
use_vipe: True
vipe_dir: ${data.root}/${data.video_dir}/stage1/dynhamr/vipe_results
vipe_root: ../third-party/vipe
